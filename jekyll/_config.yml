title: PJBUMI Tech | Aerospace, Drone, Satellite & Hydrogen Technology
description: >-
  PJBUMI Technologies is a wholly-owned subsidiary of PJBumi Berhad, a public
  listed company on Bursa Malaysia. We design hydrogen-electric drones,
  communications satellites, and aerospace systems from Malaysia to Toulouse.
url: "https://pjbumitech.com"
lang: en
baseurl: ""
