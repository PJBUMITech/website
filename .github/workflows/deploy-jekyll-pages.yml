name: Deploy to GitHub Pages (Jekyll)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options:
          - pages
          - domain
        default: pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-jekyll
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: jekyll

      - name: Install Node dependencies
        run: npm ci

      - name: Build Jekyll site
        env:
          JEKYLL_PROFILE: ${{ inputs.profile }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || 'inquiries@pjbumitech.com' }}
        run: node scripts/build-jekyll.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jekyll/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
